[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seels"
version = "0.1.0"
description = "Scientific Evidence Extraction & Learning System (MVP) - evidence-first extraction from scholarly PDFs with human-in-the-loop review"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pdfplumber>=0.11,<0.12",
  "pypdfium2>=5,<6",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.0",
  "Pillow>=10",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fpdf2>=2.7"]
llm = ["langextract>=1.7"]
shots = ["playwright>=1.40"]

[project.scripts]
seels = "seels.cli:main"

[tool.setuptools.packages.find]
include = ["seels*"]

[tool.setuptools.package-data]
seels = ["ui/static/*"]
